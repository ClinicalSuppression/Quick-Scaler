name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore QuickScaler.slnx
      - name: Build (warnings as errors)
        run: dotnet build QuickScaler.slnx -c Release --no-restore -warnaserror
      - name: Run tests
        run: dotnet run --project QuickScaler.Tests/QuickScaler.Tests.csproj -c Release --no-build
      - name: Publish (framework-dependent, x64)
        run: dotnet publish QuickScaler.csproj -c Release -r win-x64 --self-contained false -warnaserror
